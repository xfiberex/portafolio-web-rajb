# =============================================================================
# NETLIFY CONFIGURATION - PRODUCTION HARDENED SECURITY
# Portafolio Web - React 19 + Vite 7 + Tailwind CSS 4
# Last Updated: 2026
# =============================================================================

[build]
  publish = "dist"
  command = "npm run build"

# Fijado explícitamente para no depender del default de Netlify, que puede cambiar.
# Vite 7 requiere ^20.19.0 || >=22.12.0 y ESLint 10 requiere ^20.19.0 || ^22.13.0 || >=24
[build.environment]
  NODE_VERSION = "22"

# =============================================================================
# SECURITY HEADERS - APLICADOS A TODAS LAS RUTAS
# =============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    # =========================================================================
    # CONTENT SECURITY POLICY (CSP)
    # Política estricta pero funcional para React/Vite/Tailwind/Framer Motion
    # =========================================================================
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data: https:;
      connect-src 'self';
      frame-ancestors 'none';
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      upgrade-insecure-requests;
    """

    # =========================================================================
    # ANTI-CLICKJACKING
    # Previene que tu sitio sea embebido en iframes maliciosos
    # =========================================================================
    X-Frame-Options = "DENY"

    # =========================================================================
    # HSTS - HTTP STRICT TRANSPORT SECURITY
    # Fuerza HTTPS por 2 años, incluye subdominios y permite preload list
    # =========================================================================
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # =========================================================================
    # MIME SNIFFING PROTECTION
    # Previene que el navegador interprete archivos con tipo MIME incorrecto
    # =========================================================================
    X-Content-Type-Options = "nosniff"

    # =========================================================================
    # CROSS-DOMAIN POLICIES
    # Previene que Flash, PDF y Silverlight accedan datos cross-domain
    # =========================================================================
    X-Permitted-Cross-Domain-Policies = "none"

    # =========================================================================
    # XSS PROTECTION (Legacy pero útil para navegadores antiguos)
    # =========================================================================
    X-XSS-Protection = "1; mode=block"

    # =========================================================================
    # REFERRER POLICY
    # Controla qué información del referrer se envía en las solicitudes
    # =========================================================================
    Referrer-Policy = "strict-origin-when-cross-origin"

    # =========================================================================
    # PERMISSIONS POLICY (antes Feature-Policy)
    # Bloquea acceso a APIs del navegador innecesarias para un portafolio
    # =========================================================================
    Permissions-Policy = """
      accelerometer=(),
      autoplay=(),
      camera=(),
      cross-origin-isolated=(),
      display-capture=(),
      encrypted-media=(),
      fullscreen=(self),
      geolocation=(),
      gyroscope=(),
      keyboard-map=(),
      magnetometer=(),
      microphone=(),
      midi=(),
      payment=(),
      picture-in-picture=(),
      publickey-credentials-get=(),
      screen-wake-lock=(),
      sync-xhr=(),
      usb=(),
      xr-spatial-tracking=()
    """

    # =========================================================================
    # CROSS-ORIGIN POLICIES
    # Protección adicional contra ataques cross-origin
    # =========================================================================
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "same-origin"

# =============================================================================
# CACHE HEADERS PARA ASSETS ESTATICOS
#
# Regla: solo lleva `immutable` lo que NO puede cambiar de contenido sin
# cambiar de nombre. Antes habia un `/assets/*` unico, y como Vite y los PDF
# del CV comparten esa carpeta, el CV se estaba sirviendo inmutable a un anno
# (medido en produccion el 2026-09-09). Los PDF no llevan hash: hoy solo se
# salvan porque llevan la fecha en el nombre, y el dia que se actualice uno
# conservando el nombre, quien ya lo descargo veria el viejo durante un anno.
#
# Todos los patrones se mantienen DENTRO de un segmento de ruta a proposito.
# La doc de Netlify solo garantiza el comodin "inside of a path segment" y no
# documenta que gana cuando dos reglas chocan, asi que las reglas se escriben
# para no solaparse en lugar de depender de una precedencia no especificada.
# Por eso tambien desaparecieron los `/*.js` y `/*.css` de antes: bajo la
# lectura estricta no cubrian nada (no hay .js ni .css en la raiz del build) y
# bajo la amplia eran redundantes con las dos reglas de aqui abajo.
# =============================================================================
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los dos PDF del CV. `must-revalidate` obliga a preguntar al servidor una vez
# pasado el dia en vez de servir una copia vieja sin consultar.
[[headers]]
  for = "/assets/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Las fuentes no llevan hash en el nombre, pero un .woff2 de Inter no cambia
# nunca: si algun dia se actualiza, se cambia el nombre del archivo.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El criterio de T2-13 exige application/xml. Se declara en vez de depender
# de la tabla MIME por defecto de Netlify, que no es contrato publico.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# =============================================================================
# CONTEXT: DEPLOY PREVIEWS
# Sin overrides de entorno: el preview debe construirse igual que producción,
# o cualquier medición (Lighthouse, tamaño de bundle) mide una app distinta.
# =============================================================================
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"
