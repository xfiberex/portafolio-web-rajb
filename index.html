<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Ricky Jiménez - Desarrollador Full-Stack</title>
    <meta
      name="description"
      content="Portafolio de Ricky Angel Jiménez Bueno - Desarrollador Web Full-Stack especializado en .NET y MERN stack"
    />
    <meta name="author" content="Ricky Angel Jiménez Bueno" />
    <link rel="canonical" href="https://portafolio-web-rajb.netlify.app/" />

    <!-- Pinta la barra del navegador móvil del color del fondo -->
    <meta name="theme-color" content="#1a1c22" />

    <!-- ===================================================================
         OPEN GRAPH / TWITTER
         Sin esto, compartir el portafolio en LinkedIn o X mostraba
         solo la URL pelada, sin título, descripción ni imagen.
         =================================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ricky Jiménez — Portafolio" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://portafolio-web-rajb.netlify.app/" />
    <meta property="og:title" content="Ricky Jiménez — Desarrollador Web Full-Stack" />
    <meta
      property="og:description"
      content="Desarrollador Full-Stack especializado en .NET y MERN/PERN. Construyo aplicaciones modernas, escalables y accesibles."
    />
    <meta property="og:image" content="https://portafolio-web-rajb.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vista del portafolio de Ricky Angel Jiménez Bueno" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ricky Jiménez — Desarrollador Web Full-Stack" />
    <meta
      name="twitter:description"
      content="Desarrollador Full-Stack especializado en .NET y MERN/PERN. Construyo aplicaciones modernas, escalables y accesibles."
    />
    <meta name="twitter:image" content="https://portafolio-web-rajb.netlify.app/og-image.jpg" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Inter auto-hospedada. El preload importa: sin él la fuente no se
         descubre hasta que el navegador parsea el CSS, que es justo el
         retraso que hacia costoso servirla desde Google (T2-04).
         Solo se precarga el subset `latin`: es el unico que necesita el
         contenido actual (medido, 0 caracteres caen en latin-ext). -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- ===================================================================
         DATOS ESTRUCTURADOS (schema.org/Person)
         No lo bloquea el CSP `script-src 'self'`: los tipos que no son
         JavaScript ejecutable salen del algoritmo de preparación del
         script antes de la comprobación de CSP.
         =================================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ricky Angel Jiménez Bueno",
        "url": "https://portafolio-web-rajb.netlify.app/",
        "jobTitle": "Desarrollador Web Full-Stack",
        "description": "Desarrollador Full-Stack especializado en el stack MERN/PERN y .NET.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "DO",
          "addressLocality": "Santo Domingo"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Universidad Dominicana O&M"
        },
        "knowsAbout": [
          "React",
          "Next.js",
          "TypeScript",
          "Node.js",
          "C#",
          "ASP.NET Core",
          "Blazor",
          "PostgreSQL",
          "SQL Server",
          "MongoDB"
        ],
        "sameAs": [
          "https://github.com/xfiberex",
          "https://www.linkedin.com/in/ricky-angel-jimenez-bueno-52659928a"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- ===================================================================
         SIN JAVASCRIPT (T2-14)
         El <body> solo contiene #root, así que sin JS la página quedaba
         literalmente en blanco: ni una palabra. Esto es el mínimo para que
         alguien con un proxy corporativo restrictivo —o con el JS caído—
         siga sabiendo quién soy y cómo contactarme.

         Estilos en línea a propósito: no dependen de que Tailwind haya
         escaneado este archivo. El CSP los permite ('unsafe-inline' en
         style-src, que ya hacía falta para Framer Motion).

         El correo va SIN `mailto:` y con [at]/[dot]: los bots que no
         ejecutan JavaScript son exactamente los que leerían este bloque,
         y son de los que protege ObfuscatedEmail. Una persona lo lee sin
         problema; ver T3-13.
         =================================================================== -->
    <noscript>
      <div
        style="
          max-width: 34rem;
          margin: 0 auto;
          padding: 4rem 1.5rem;
          color: #f8f8f8;
          font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          line-height: 1.6;
        "
      >
        <p style="margin: 0 0 0.5rem; font-size: 0.875rem; letter-spacing: 0.1em; text-transform: uppercase; color: #487fff">
          Hola, soy
        </p>
        <h1 style="margin: 0 0 0.5rem; font-size: 2rem; line-height: 1.15">Ricky Angel Jiménez Bueno</h1>
        <p style="margin: 0 0 1.5rem; font-size: 1.125rem; color: #c9ccd1">
          Desarrollador Web Full-Stack — .NET y MERN/PERN
        </p>

        <p style="margin: 0 0 1.5rem; color: #c9ccd1">
          Esta página necesita JavaScript para mostrarse completa. Aquí van los datos esenciales:
        </p>

        <p style="margin: 0 0 0.5rem">
          <strong>Email:</strong> rickyjimenez1820 [at] gmail [dot] com
        </p>

        <ul style="margin: 0; padding-left: 1.25rem">
          <li style="margin-bottom: 0.35rem">
            <a href="/assets/CV-Ricky%20Angel%20Jim%C3%A9nez%20Bueno-07-09-2026.pdf" style="color: #487fff">
              Descargar mi CV en PDF
            </a>
          </li>
          <li style="margin-bottom: 0.35rem">
            <a href="https://github.com/xfiberex" style="color: #487fff">github.com/xfiberex</a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/ricky-angel-jimenez-bueno-52659928a"
              style="color: #487fff"
            >
              LinkedIn
            </a>
          </li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
