name: Enlaces

# Cron y no en cada PR a propósito: los enlaces externos flaquean por
# motivos ajenos al commit, y romper PRs por eso entrena a ignorar el CI.
on:
  schedule:
    - cron: "0 9 * * 1" # lunes 09:00 UTC
  workflow_dispatch: # también a mano, desde la pestaña Actions

# Necesario para que el paso de crear issue pueda escribir.
permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Verificar enlaces externos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Revisar enlaces
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Globs explícitos, no `src/`: pasando el directorio, lychee filtra
          # por extensión conocida y se saltea los .ts, así que no revisaba
          # ninguno de los enlaces de src/data (repos, demos, certificados).
          #
          # --scheme limita el chequeo a http/https, o sea sólo enlaces
          # externos, que es el propósito del workflow. Sin esto intenta
          # resolver rutas locales como el /favicon.svg de index.html, y no
          # existe un --root-dir que sirva para las dos: el favicon se sirve
          # desde public/ y el /src/main.tsx desde la raíz del repo.
          args: >-
            --config lychee.toml
            --no-progress
            --scheme http
            --scheme https
            index.html
            'src/**/*.ts'
            'src/**/*.tsx'
          fail: false # no falla el job: el reporte se convierte en issue

      - name: Abrir issue si hay enlaces rotos
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Enlaces rotos detectados en el portafolio
          content-filepath: ./lychee/out.md
          labels: mantenimiento
