name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empujan varios commits seguidos, cancela las corridas viejas
# de la misma rama en vez de hacerlas cola.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 para igualar NODE_VERSION de netlify.toml: si el build
      # pasa acá, pasa en el deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci instala exactamente lo del lock y falla si package.json y
      # package-lock.json están desincronizados — justo el estado que tenía
      # este repo, con ESLint 10 declarado y 9 instalado.
      - name: Instalar dependencias
        run: npm ci

      # type-check y build corren ambos tsc, pero como pasos separados dan
      # dos señales distintas en la UI: se ve si falló por tipos o por bundle.
      - name: Chequeo de tipos
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Paso propio y no `--write`: en CI el formato solo se comprueba.
      # Los .md quedan fuera (ver .prettierignore): ROADMAP y CONTEXT
      # estan formateados a mano y Prettier los reflotaria.
      - name: Formato (Prettier)
        run: npm run format:check

      # Solo funciones puras: la resolución de iconos (~90 heurísticas regex
      # donde el orden importa) y los helpers de URL. El test de tabla falla
      # si se añade una tecnología a src/data/ sin icono, que hasta ahora era
      # un fallo silencioso.
      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build

      # Después del build a propósito: los e2e corren contra `vite preview`,
      # es decir contra lo que se publica, no contra el servidor de desarrollo.
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      # axe sobre la página REVELADA. El test se niega a auditar si queda
      # algún elemento a opacidad < 1, porque entonces axe mezcla los colores
      # con el fondo y el resultado no significa nada (ver CONTEXT.md).
      - name: Accesibilidad (axe-core)
        run: npm run test:e2e

      # Comparacion EXACTA contra imagenes de referencia. Las lineas base
      # llevan la plataforma en el nombre (-chromium-linux) porque el
      # renderizado de fuentes difiere entre sistemas; las de Linux se
      # generan en el contenedor oficial de Playwright, no a mano.
      # Si este paso falla por un cambio de diseno INTENCIONADO, hay que
      # regenerarlas: ver README, seccion de snapshots visuales.
      - name: Snapshots visuales
        run: npm run test:visual

      # Chrome viene preinstalado en la imagen ubuntu-latest. Se imprime la
      # version para que, si algun dia desaparece, el fallo diga por que en
      # vez de morir dentro de chrome-launcher.
      - name: Comprobar que hay Chrome
        run: google-chrome --version

      # Presupuestos que FALLAN el build, no que solo informan (T2-08).
      # Los umbrales salen de una linea base medida, con su margen anotado
      # en lighthouserc.json. El LCP que estima Lighthouse depende del grafo
      # de red y no de la CPU —comprobado con cpuSlowdown x4, x6 y x8: el
      # mismo valor—, asi que no oscila segun lo cargado que este el runner.
      - name: Presupuestos de rendimiento (Lighthouse CI)
        run: npm run lighthouse

      # `lhci` en verde no imprime ni un numero, asi que sin esto solo se
      # conoceria el margen contra los umbrales el dia que rompan.
      # `always()`: interesa aun mas cuando el paso de arriba ha fallado.
      - name: Resumen de Lighthouse
        if: always()
        run: node scripts/resumen-lighthouse.mjs

      - name: Guardar el informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Guardar el informe de Lighthouse si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
